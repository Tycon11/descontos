<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descontos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <header>Calc Descontos
    <p>aplique descontos a seus produtos </p>
    </header>
    <div class="total">
        <div class="produto">
            <label for="Nome">Nome do Produto:</label>
            <input type="text" id="Nome" name="Nome">
            <label for="Preco">Preço do Produto: R$</label>
            <input type="number" id="Preco" name="Preco">
                        <label for="p%">Porcentagem de Desconto: </label>
            <input type="number" id="pa" name="p%" step="0.1">
        </div>
        <button id="Desconto" onclick="Desconto()">Descontar</button>
    </div>
</body>
</html>
